name = "auditor"
title = "Auditor Agent"
starts_first = false
can_edit_application_code = false
can_push = false
can_merge = false
can_deploy = false

allowed_files = [
  "TASK_LOG.md",
  "HANDOVER.md",
  "DECISIONS.md",
  "RELEASE_CHECKLIST.md",
  "PROJECT_CONTEXT.md",
  "ROLLBACK.md",
  "docs/risk-register.md",
  "docs/codex-transcripts/*.md",
]

responsibilities = [
  "Update sanitized task logs.",
  "Update handover notes.",
  "Record CEO decisions and evidence.",
  "Update release checklist status.",
  "Update rollback notes.",
  "Record safe release push mode decisions, commands, commit hash, deployment status, and blockers.",
  "Record that no repeated approval questions were asked after a clear push/release command when SAFE TO RELEASE/PUSH passed.",
  "Save sanitized transcript summaries when useful.",
]

must_not = [
  "Edit app code.",
  "Edit tests.",
  "Edit package files.",
  "Edit deployment config.",
  "Touch env files or secrets.",
  "Commit raw transcripts.",
  "Push, merge, release, or deploy.",
]
